services:
  overvoice:
    build: .
    env_file: .env
    volumes:
      - ./models:/app/models:Z
      - ./debug-audio:/app/debug-audio:Z
      - ./data:/app/data:Z
    restart: unless-stopped
    # Host networking avoids Docker's NAT/userland-proxy for the voice UDP
    # stream, which otherwise causes jitter/dropped packets mid-playback.
    network_mode: host
